<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heathcetide Knowledge</title>
    <meta
      name="description"
      content="heathcetide Knowledge — 从 GitHub 只读同步的个人学习笔记阅读器"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button
          type="button"
          class="btn btn-ghost menu-btn"
          id="menuBtn"
          aria-label="打开目录"
        >
          目录
        </button>
        <a class="brand" href="./" id="brandLink">
          <span class="brand-name">heathcetide Knowledge</span>
          <span class="brand-sub">GitHub 只读同步 · 学习笔记</span>
        </a>
        <div class="topbar-actions">
          <button type="button" class="btn" id="refreshBtn" title="清除缓存并重新拉取">
            刷新
          </button>
          <a
            class="btn btn-primary"
            id="repoLink"
            href="https://github.com/heathcetide/heathcetide-knowledge"
            target="_blank"
            rel="noopener noreferrer"
            >仓库</a
          >
        </div>
      </header>

      <div class="sidebar-backdrop" id="backdrop" hidden></div>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-tools">
            <input
              class="search"
              id="searchInput"
              type="search"
              placeholder="搜索笔记路径…"
              autocomplete="off"
            />
            <div class="meta-line">
              <span id="fileCount">加载中…</span>
              <span id="syncHint">只读</span>
            </div>
          </div>
          <nav class="tree" id="tree" aria-label="笔记目录"></nav>
        </aside>

        <main class="main">
          <article class="reader">
            <div class="reader-inner" id="reader">
              <p class="empty">正在从 GitHub 拉取目录…</p>
            </div>
          </article>
        </main>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
