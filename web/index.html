<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heathcetide Knowledge</title>
    <meta
      name="description"
      content="heathcetide Knowledge — 单页阅读器与 Obsidian 风格知识图谱"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button type="button" class="btn btn-ghost menu-btn" id="menuBtn" aria-label="打开目录">
          目录
        </button>
        <a class="brand" href="./" id="brandLink">
          <span class="brand-name">heathcetide Knowledge</span>
          <span class="brand-sub">单页阅读 · 知识图谱</span>
        </a>

        <div class="view-switch" role="tablist" aria-label="视图切换">
          <button type="button" class="view-btn active" data-view="read" id="viewRead">
            阅读
          </button>
          <button type="button" class="view-btn" data-view="graph" id="viewGraph">
            图谱
          </button>
        </div>

        <div class="topbar-actions">
          <div class="graph-tools" id="graphTools" hidden>
            <button type="button" class="btn btn-sm active" data-gmode="global" id="gGlobal">
              全库
            </button>
            <button type="button" class="btn btn-sm" data-gmode="local" id="gLocal">
              局部
            </button>
          </div>
          <button type="button" class="btn btn-sm" id="refreshBtn" title="清除缓存并重载">
            刷新
          </button>
          <a
            class="btn btn-sm btn-primary"
            id="repoLink"
            href="https://github.com/heathcetide/heathcetide-knowledge"
            target="_blank"
            rel="noopener noreferrer"
            >仓库</a
          >
        </div>
      </header>

      <div class="sidebar-backdrop" id="backdrop" hidden></div>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-tools">
            <input
              class="search"
              id="searchInput"
              type="search"
              placeholder="搜索笔记…"
              autocomplete="off"
            />
            <div class="meta-line">
              <span id="fileCount">加载中…</span>
              <span id="syncHint">快照</span>
            </div>
          </div>
          <nav class="tree" id="tree" aria-label="笔记目录"></nav>
        </aside>

        <main class="main">
          <section class="panel panel-read is-active" id="panelRead">
            <article class="reader" id="readerScroll">
              <div class="reader-inner" id="reader">
                <p class="empty">正在加载…</p>
              </div>
            </article>
          </section>

          <section class="panel panel-graph" id="panelGraph">
            <div class="graph-meta" id="graphMeta"></div>
            <div class="graph-stage" id="graphStage">
              <p class="empty">切换到「图谱」查看知识网络</p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
